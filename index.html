<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dragon Ball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="backg">
  <div class="container py-4">
    <div class="d-flex justify-content-center">
      <img class="logotipo" src="assets/logotipo.png" alt="logotipo">
    </div>
    <div class="searchbar">
      <input id="searchInput" type="text" class="search" placeholder="Buscar personajes..." />
      <button id="searchButton" class="button">Buscar</button>
    </div>
    <div id="message" class="text-center text-danger mb-3"></div>
    <div id="results" class="row g-4"></div>
  </div>
  <div id="loader" class="text=center my-4" style="display: none;">
    <div class="spinner-border text-warning" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>
  
  <script src="assets/js/script.js"></script>
</body>
</html>
